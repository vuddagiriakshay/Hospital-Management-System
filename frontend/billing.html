<h1 class="page-title">

<div class="form-container">

<h2>Generate Bill</h2>

<label>Select Patient</label>

<select id="patient">

</select>

<label>Consultation Fee</label>

<input
type="number"
id="consultation"
placeholder="Consultation Fee">

<label>Medicine Fee</label>

<input
type="number"
id="medicine"
placeholder="Medicine Fee">

<label>Lab Fee</label>

<input
type="number"
id="lab"
placeholder="Lab Fee">

<button onclick="createBill()">

Generate Bill

</button>

</div>

<table>

<thead>

<tr>

<th>ID</th>
<th>Patient</th>
<th>Consultation</th>
<th>Medicine</th>
<th>Lab</th>
<th>Total</th>
<th>Date</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="billTable">

</tbody>

</table>
