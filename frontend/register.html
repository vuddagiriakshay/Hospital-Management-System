<!DOCTYPE html>

<html>

<head>


<title>Register</title>

<link rel="stylesheet" href="css/style.css">

<style>

    body{

        display:flex;

        justify-content:center;

        align-items:center;

        height:100vh;

        background:#f4f6f9;

    }

    .register-card{

        width:450px;

        background:white;

        padding:30px;

        border-radius:10px;

        box-shadow:
        0px 4px 10px rgba(0,0,0,0.2);

    }

    h2{

        text-align:center;

        margin-bottom:20px;

    }

</style>


</head>

<body>

<div class="register-card">

<h2>Hospital Management Registration</h2>

<input
id="username"
type="text"
placeholder="Username">

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<select id="role">

<option value="admin">
Admin
</option>

<option value="doctor">
Doctor
</option>

<option value="receptionist">
Receptionist
</option>

</select>

<button
onclick="register()">

Register

</button>

<br><br>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

<script src="js/auth.js"></script>

</body>

</html>
