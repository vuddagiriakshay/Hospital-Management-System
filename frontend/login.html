<!DOCTYPE html>

<html>

<head>

<title>Login</title>

<link rel="stylesheet" href="css/style.css">

<style>

    body{

        display:flex;

        justify-content:center;

        align-items:center;

        height:100vh;

        background:#f4f6f9;

    }

    .login-card{

        width:400px;

        background:white;

        padding:30px;

        border-radius:10px;

        box-shadow:
        0px 4px 10px rgba(0,0,0,0.2);

    }

    h2{

        text-align:center;

        margin-bottom:20px;

    }

</style>


</head>

<body>

<div class="login-card">

<h2>Hospital Management Login</h2>

<input
id="loginEmail"
type="email"
placeholder="Email">

<input
id="loginPassword"
type="password"
placeholder="Password">

<button
onclick="login()">

Login

</button>

<br><br>

<p>

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</div>

<script src="js/auth.js"></script>

</body>

</html>
